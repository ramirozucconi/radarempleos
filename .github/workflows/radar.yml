name: Radar de Empleos

on:
  schedule:
    - cron: "17 10,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Recolectar avisos
        run: python -m radar.main

      - name: Guardar resultados
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Radar: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
