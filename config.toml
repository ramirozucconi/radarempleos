# Workday: host, tenant y site salen de la URL de empleos de la empresa:
# https://<host>/<site>/job/...   ->   API: https://<host>/wday/cxs/<tenant>/<site>/jobs
[[sources.workday]]
company = "Dow"
host = "dow.wd1.myworkdayjobs.com"
tenant = "dow"
site = "ExternalCareers"

[[sources.workday]]
company = "Assurant"
host = "assurant.wd1.myworkdayjobs.com"
tenant = "assurant"
site = "assurant_careers"

[[sources.workday]]
company = "Chevron"
host = "chevron.wd5.myworkdayjobs.com"
tenant = "chevron"
site = "jobs"

[[sources.workday]]
company = "Baker Hughes"
host = "bakerhughes.wd5.myworkdayjobs.com"
tenant = "bakerhughes"
site = "BakerHughes"

[sources.workday_queries]
# Textos que se buscan en cada Workday (después se filtra por ubicación).
terms = ["procurement", "purchasing", "compras", "accounts payable", "procure to pay",
         "business analyst", "data analyst", "SAP"]

# ---- Bolsas de empleo remoto ----

[sources.remotive]
searches = ["procurement", "purchasing", "accounts payable", "billing", "finance operations",
            "business analyst", "data analyst", "power bi", "SAP", "revenue operations"]

[sources.himalayas]
searches = ["procurement", "accounts payable", "billing operations", "business analyst",
            "data analyst", "finance operations", "SAP"]

[sources.getonbrd]
searches = ["procurement", "compras", "business analyst", "data analyst", "power bi",
            "finanzas", "operaciones", "SAP"]

[sources.rss]
feeds = [
  "https://weworkremotely.com/remote-jobs.rss",
]
