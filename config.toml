# Configuración del recolector del Radar de Empleos.
# Para sumar una empresa, agregá su "slug" en la lista de su sistema de reclutamiento.
# Si un slug no existe, el recolector lo anota en data/sources_report.json y sigue.

[general]
max_age_days = 30        # descartar avisos más viejos que esto (si el aviso trae fecha)
min_score = 35           # puntaje mínimo para entrar en candidates.json
max_candidates = 200     # tope de avisos en el archivo de salida
forget_after_days = 60   # olvidar avisos que no aparecen hace más de N días

# Empresas prioritarias: suman puntos extra (comparación sin mayúsculas, por substring).
priority_companies = [
  "anthropic", "openai", "mistral", "deepmind", "cohere", "elevenlabs", "synthesia",
  "hugging face", "scale", "databricks", "deepgram",
  "coinbase", "kraken", "binance", "bitso", "stripe", "wise", "revolut", "adyen",
  "ripple", "circle", "crypto.com", "okx", "bybit", "deel", "nubank", "dlocal",
  "chevron", "mercado libre", "mercadolibre", "globant", "ypf", "tecpetrol",
]

# ---- Sistemas de reclutamiento de cada empresa (APIs públicas) ----

[sources.greenhouse]
slugs = [
  "anthropic", "stripe", "coinbase", "databricks", "scaleai", "adyen", "ripple",
  "circle", "nubank", "okx", "cohere", "huggingface", "deepmind", "dlocal", "bitso",
  "remotecom", "caylent", "cookunity", "airtable", "brex", "rippling", "plaid",
  "chainalysis", "fireblocks", "anchorage", "gemini", "consensys", "moonpay",
  "payoneer", "ebanx", "clip", "konfio", "kavak", "rappi", "nuvemshop",
]

